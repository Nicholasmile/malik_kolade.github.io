project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "projects/*.qmd"
    - "!projects/project-template.qmd"
  resources:
    - assets/**
website:
  site-url: "https://nicholasmile.github.io/malik_kolade.github.io/"
  title: "Malik Kolade"
  description: "Malik Kolade — Economics, Research, Data Science, and Technology."
  navbar:
    background: light
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: projects.qmd
        text: Projects
      - href: research.qmd
        text: Research
      - href: articles.qmd
        text: Notes
      - href: cv.qmd
        text: CV
      - href: contact.qmd
        text: Contact
    right:
      - icon: github
        href: https://github.com/Nicholasmile
        aria-label: GitHub profile
      - icon: envelope
        href: mailto:theonlykolademalik@gmail.com
        aria-label: Email Malik
  page-footer:
    left: "© 2026 Malik Ishola Kolade"
    right: "Economics · Research · Data Science · Technology"
  search: true
  back-to-top-navigation: true
format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    page-layout: full
    smooth-scroll: true
    link-external-newwindow: true
execute:
  freeze: auto
